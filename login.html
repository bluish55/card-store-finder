<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>로그인</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e53935">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px 28px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .login-title {
      font-size: 20px;
      font-weight: bold;
      color: #212121;
      margin-bottom: 4px;
    }
    .login-sub {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
      text-align: center;
      line-height: 1.5;
    }
    .social-btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.15s;
    }
    .social-btn:active { opacity: 0.7; }
    .btn-google {
      background: white;
      border: 1.5px solid #ddd;
      color: #3c4043;
    }
    .btn-kakao {
      background: #FEE500;
      color: #191919;
    }
    .btn-naver {
      background: #03C75A;
      color: white;
    }
    .divider {
      width: 100%;
      height: 1px;
      background: #eee;
      margin: 4px 0;
    }
    .skip-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
      padding: 4px 8px;
    }
    .skip-btn:active { opacity: 0.6; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-title">포켓몬카드 판매점</div>
    <div class="login-sub">로그인하면 설정이 여러 기기에<br>저장돼요</div>

    <button class="social-btn btn-google" onclick="signInWith('google')">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
      구글로 로그인
    </button>

    <button class="social-btn btn-kakao" onclick="signInWith('kakao')">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#191919" d="M9 1C4.582 1 1 3.806 1 7.25c0 2.194 1.412 4.125 3.556 5.25L3.75 16l4.069-2.688A9.5 9.5 0 009 13.5c4.418 0 8-2.806 8-6.25S13.418 1 9 1z"/></svg>
      카카오로 로그인
    </button>

    <button class="social-btn btn-naver" onclick="signInWith('naver')">
      <span style="font-size:16px;font-weight:900;letter-spacing:-1px">N</span>
      네이버로 로그인
    </button>

    <div class="divider"></div>
    <button class="skip-btn" onclick="history.back()">나중에 할게요</button>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js"></script>
</body>
</html>
