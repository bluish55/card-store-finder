<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>설정</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e53935">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="settings.css">
</head>
<body>

  <!-- View 1: 설정 메인 -->
  <div id="main-view">
    <div class="page-header">
      <button class="back-btn" onclick="history.back()">←</button>
      <h1>설정</h1>
    </div>

    <div class="settings-section">
      <div id="login-prompt" class="hidden">
        <div class="settings-item" onclick="location.href='login.html'" style="cursor:pointer">
          <span>로그인하기</span>
          <span style="color:#aaa;font-size:13px">›</span>
        </div>
      </div>
      <div id="profile-section" class="hidden">
        <div class="settings-item">
          <div style="display:flex;align-items:center;gap:10px">
            <img id="profile-avatar" width="36" height="36" style="border-radius:50%;object-fit:cover" class="hidden">
            <span id="profile-name"></span>
          </div>
          <button onclick="signOut()" style="font-size:13px;color:#e53935;background:none;border:none;cursor:pointer">로그아웃</button>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-title">위치</div>
      <div class="settings-item">
        <span>내 위치 사용</span>
        <label class="toggle-switch">
          <input type="checkbox" id="location-toggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-header">
        <div class="section-title">핀 프리셋</div>
        <button id="add-preset-btn">+ 추가</button>
      </div>
      <div id="preset-list"></div>
    </div>

    <div class="settings-section">
      <div class="section-header">
        <div class="section-title">알림</div>
        <button id="add-noti-preset-btn">+ 추가</button>
      </div>
      <div id="noti-preset-list"></div>
      <div id="store-noti-list"></div>
    </div>
  </div>

  <!-- View 2: 프리셋 편집 -->
  <div id="preset-edit-view" class="hidden">
    <div class="page-header">
      <button class="back-btn" onclick="backFromPresetEdit()">←</button>
      <input type="text" id="preset-name-input" placeholder="프리셋 이름">
      <button onclick="savePresetName()">저장</button>
    </div>
    <p class="info-text">규칙은 위→아래 순서로 적용됩니다. 첫 번째로 일치하는 규칙의 핀이 표시됩니다.</p>
    <div id="rule-list"></div>
    <div class="add-btn-wrap">
      <button id="add-rule-btn" onclick="openRuleEdit(null)">+ 규칙 추가</button>
    </div>
  </div>

  <!-- View 3: 규칙 편집 -->
  <div id="rule-edit-view" class="hidden">
    <div class="page-header">
      <button class="back-btn" onclick="backFromRuleEdit()">←</button>
      <h1>규칙 설정</h1>
      <button onclick="saveRule()">저장</button>
    </div>

    <div class="settings-section">
      <div class="section-title">조건</div>
      <div class="rule-field">
        <label>제보 상태</label>
        <select id="rule-report-type">
          <option value="any">모두</option>
          <option value="available">있어요</option>
          <option value="low_stock">마지막 몇 개</option>
          <option value="out_of_stock">없어요</option>
          <option value="no_report">제보 없음</option>
        </select>
      </div>
      <div class="rule-field">
        <label>시간 조건</label>
        <select id="rule-time-type" onchange="updateTimeInputs()">
          <option value="none">없음</option>
          <option value="max">X시간 이내</option>
          <option value="range">X ~ Y시간</option>
          <option value="min">X시간 초과</option>
        </select>
      </div>
      <div id="time-inputs" class="hidden">
        <div class="rule-field time-row">
          <input type="number" id="rule-min-hours" placeholder="시작" min="0" class="hidden">
          <span id="time-separator" class="hidden">~</span>
          <input type="number" id="rule-max-hours" placeholder="시간" min="0">
          <span class="time-unit">시간</span>
        </div>
      </div>
      <div class="rule-field">
        <label>찜한 가게만</label>
        <label class="toggle-switch">
          <input type="checkbox" id="rule-favorite-only">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-title">핀</div>
      <div class="rule-field">
        <label>핀 종류</label>
        <div class="pin-type-toggle">
          <button class="pin-type-btn active" data-type="color" onclick="setPinType('color')">색깔</button>
          <button class="pin-type-btn" data-type="image" onclick="setPinType('image')">이미지</button>
        </div>
      </div>
      <div id="pin-color-field" class="rule-field">
        <label>색상</label>
        <input type="color" id="rule-pin-color" value="#43a047">
      </div>
      <div id="pin-image-field" class="rule-field hidden">
        <label>이미지</label>
        <div class="pin-image-wrap">
          <div id="pin-image-preview"></div>
          <input type="file" id="rule-pin-image" accept="image/*" onchange="previewPinImage(this)">
        </div>
      </div>
    </div>
  </div>

  <!-- View 4: 알림 프리셋 편집 -->
  <div id="noti-edit-view" class="hidden">
    <div class="page-header">
      <button class="back-btn" onclick="backFromNotiEdit()">←</button>
      <input type="text" id="noti-preset-name-input" placeholder="알림 이름">
      <button onclick="saveNotiPreset()">저장</button>
    </div>

    <div class="settings-section">
      <div class="settings-item">
        <span>알림 사용</span>
        <label class="toggle-switch">
          <input type="checkbox" id="noti-enabled" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-title">위치</div>
      <div class="settings-item" style="cursor:pointer" onclick="setNotiLocationType('gps')" id="noti-loc-gps-row">
        <div>
          <div>현재 내 위치</div>
          <div style="font-size:12px;color:#aaa">마지막으로 앱을 켠 위치 기준</div>
        </div>
        <span id="noti-loc-gps-check">✓</span>
      </div>
      <div class="settings-item" style="cursor:pointer" onclick="setNotiLocationType('fixed')" id="noti-loc-fixed-row">
        <div>
          <div>직접 지정</div>
          <div id="noti-loc-fixed-address" style="font-size:12px;color:#aaa">위치를 선택해주세요</div>
        </div>
        <span id="noti-loc-fixed-check" style="display:none">✓</span>
      </div>
      <div id="noti-map-picker-btn-wrap" class="hidden" style="padding:4px 16px 12px">
        <button onclick="openNotiMapPicker()" style="width:100%;padding:12px;border:1.5px solid #e53935;border-radius:10px;background:white;color:#e53935;font-size:14px;font-weight:600;cursor:pointer">📍 지도에서 위치 선택하기</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-title">반경</div>
      <div class="settings-item">
        <div class="chip-group" id="noti-radius-chips">
          <button class="chip" data-value="500">500m</button>
          <button class="chip active" data-value="1000">1km</button>
          <button class="chip" data-value="3000">3km</button>
          <button class="chip" data-value="5000">5km</button>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-title">가게 종류</div>
      <div class="settings-item">
        <div class="chip-group" id="noti-type-chips">
          <button class="chip active" data-value="all">전체</button>
          <button class="chip" data-value="자판기">자판기</button>
          <button class="chip" data-value="편의점">편의점</button>
          <button class="chip" data-value="문방구">문방구</button>
          <button class="chip" data-value="카드샵">카드샵</button>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-title">재고 상태</div>
      <div class="settings-item">
        <div class="chip-group" id="noti-report-chips">
          <button class="chip active" data-value="available">있어요</button>
          <button class="chip active" data-value="low_stock">마지막 몇 개</button>
          <button class="chip" data-value="out_of_stock">없어요</button>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-item">
        <span>찜한 가게만</span>
        <label class="toggle-switch">
          <input type="checkbox" id="noti-fav-only">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-item">
        <span>알림 시간대 설정</span>
        <label class="toggle-switch">
          <input type="checkbox" id="noti-time-enabled" onchange="toggleNotiTimeRange(this.checked)">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div id="noti-time-range" class="hidden">
        <div class="settings-item">
          <span>시작</span>
          <input type="time" id="noti-time-start" value="09:00" style="border:1.5px solid #ddd;border-radius:8px;padding:6px 10px;font-size:14px">
        </div>
        <div class="settings-item">
          <span>종료</span>
          <input type="time" id="noti-time-end" value="22:00" style="border:1.5px solid #ddd;border-radius:8px;padding:6px 10px;font-size:14px">
        </div>
        <div style="padding:8px 16px;font-size:12px;color:#aaa">시간대 밖 제보는 시작 시각에 모아서 알림으로 전송돼요</div>
      </div>
    </div>
  </div>

  <!-- 알림 위치 지도 picker -->
  <div id="noti-map-picker" class="hidden" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:1000;display:flex;flex-direction:column">
    <!-- 검색 아이콘 버튼 -->
    <button id="noti-picker-search-btn" onclick="openNotiPickerSearch()" style="position:absolute;top:12px;left:12px;z-index:20;width:44px;height:44px;border:none;border-radius:50%;background:white;color:#333;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,0.15);cursor:pointer">🔍</button>
    <!-- 검색창 (숨김) -->
    <div id="noti-picker-search-bar" class="hidden" style="position:absolute;top:12px;left:12px;right:12px;z-index:20">
      <div style="display:flex;gap:8px">
        <div style="flex:1;position:relative">
          <input id="noti-picker-search" type="text" placeholder="장소 검색" style="width:100%;padding:10px 14px;border:none;border-radius:10px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,0.15);outline:none">
          <div id="noti-picker-dropdown" class="hidden" style="position:absolute;top:100%;left:0;right:0;background:white;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.15);margin-top:4px;overflow:hidden;z-index:30"></div>
        </div>
        <button onclick="closeNotiPickerSearch()" style="padding:10px 14px;border:none;border-radius:10px;background:white;color:#333;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,0.15);cursor:pointer">✕</button>
      </div>
    </div>
    <!-- 반경 컨트롤 -->
    <div style="position:absolute;bottom:90px;left:12px;z-index:20;display:flex;flex-direction:column;gap:6px">
      <button onclick="toggleNotiPickerRadius()" id="noti-radius-toggle-btn" style="padding:8px 12px;border:none;border-radius:8px;background:white;color:#333;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,0.15);cursor:pointer">반경 표시</button>
      <div id="noti-picker-radius-chips" style="display:flex;flex-direction:column;gap:4px;display:none">
        <button class="picker-radius-chip active" data-value="500" onclick="setNotiPickerRadius(500)">500m</button>
        <button class="picker-radius-chip" data-value="1000" onclick="setNotiPickerRadius(1000)">1km</button>
        <button class="picker-radius-chip" data-value="3000" onclick="setNotiPickerRadius(3000)">3km</button>
        <button class="picker-radius-chip" data-value="5000" onclick="setNotiPickerRadius(5000)">5km</button>
      </div>
    </div>
    <div style="flex:1;position:relative">
      <div id="noti-map-picker-map" style="width:100%;height:100%"></div>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);font-size:32px;z-index:10;pointer-events:none;line-height:1">📍</div>
    </div>
    <div style="background:white;padding:16px;box-shadow:0 -2px 8px rgba(0,0,0,0.1)">
      <p id="noti-picker-address" style="font-size:14px;color:#555;margin-bottom:12px">위치를 선택해주세요</p>
      <div style="display:flex;gap:10px">
        <button onclick="cancelNotiMapPicker()" style="flex:1;padding:12px;border:none;border-radius:10px;background:#f0f0f0;color:#333;font-size:14px;font-weight:600;cursor:pointer">취소</button>
        <button onclick="confirmNotiMapPicker()" style="flex:1;padding:12px;border:none;border-radius:10px;background:#e53935;color:white;font-size:14px;font-weight:600;cursor:pointer">여기로 설정</button>
      </div>
    </div>
  </div>

  <!-- 미저장 확인 모달 -->
  <div id="unsaved-modal" class="unsaved-modal hidden">
    <div class="unsaved-box">
      <p>변경사항을 저장할까요?</p>
      <div class="unsaved-btns">
        <button id="unsaved-discard" class="btn-secondary">저장 안 함</button>
        <button id="unsaved-save">저장</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cf6b8c5a31ab27835ad75b58e202f3ea&libraries=services"></script>
  <script src="settings.js"></script>
</body>
</html>
